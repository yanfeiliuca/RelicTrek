name: Auto-Generate Sitemap

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "generate-sitemap.py"
      - "normalize-extensionless-urls.py"
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    # Prevent infinite loop: skip if the last commit was made by this action
    if: "!contains(github.event.head_commit.message, '[sitemap]')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize extensionless URLs
        run: python normalize-extensionless-urls.py

      - name: Generate sitemap.xml
        run: python generate-sitemap.py

      - name: Commit and push sitemap.xml and normalized blog URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml en/blog zh/blog
          if git diff --staged --quiet; then
            echo "No sitemap or normalized blog URL changes"
          else
            git commit -m "[sitemap] Auto-update sitemap.xml"
            git push
          fi

      - name: Ping Google
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://relictrek.com/sitemap.xml" || true

      - name: Ping Bing
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://relictrek.com/sitemap.xml" || true
