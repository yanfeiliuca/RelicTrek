<section id="why"><h2>1. 为什么需要它</h2><p>每个主线Boss掉落稀有魂晶。可向Alidoro兑换对应特殊武器。<strong>但每个魂晶只能换特殊武器OR特殊护身符——不能两者兼得。</strong>单周目只能选一个，全收集需要至少两周目。</p></section>
<section id="what"><h2>2. 它有什么作用</h2><p><strong>Alidoro</strong>是主要交易员——首次出现在第四区域大教堂地下深处电梯。<strong>Hugo</strong>在Alidoro被杀后接替交易。<strong>Klaus</strong>是序曲DLC交易员。</p></section>
<section id="prereqs"><h2>3. 前置条件</h2><ul><li>需要到达第四区域找到Alidoro</li><li>需要收集Boss击败后的稀有魂晶</li><li>不要在交易前杀死Alidoro</li></ul></section>
<div class="ad-placeholder" style="margin:2rem 0">Google AdSense — In-Content Ad #1</div><section id="route"><h2>4. 最优路线</h2><table class="mt"><tr><th>Boss</th><th>区域</th><th>特殊武器</th><th>特殊护身符</th></tr><tr><td>巡游大师</td><td>I</td><td>傀儡撕裂者</td><td>傀儡大师护身符</td></tr><tr><td>报废守卫</td><td>II</td><td>酸性水晶矛</td><td>过载储能护身符</td></tr><tr><td>傀儡国王</td><td>V</td><td>人性证明（物品）</td><td>破碎梦想承担者</td></tr><tr><td>冠军维克托</td><td>VI</td><td>七卷弹簧剑</td><td>满月护身符</td></tr><tr><td>堕落大主教安德烈斯</td><td>IV</td><td>双龙剑</td><td>极限改造护身符</td></tr><tr><td>白女士</td><td>VII</td><td>冰冻盛宴（或黑钢切割者）</td><td>冰冻盛宴护身符</td></tr><tr><td>西蒙·马努斯</td><td>X</td><td>神之臂</td><td>平衡护身符</td></tr><tr><td>拉克萨西亚</td><td>XI</td><td>盟约三叉戟</td><td>新月护身符</td></tr></table><p><strong>一周目优先：</strong>先选武器。<strong>二周目（NG+）：</strong>选护身符。</p></section><div class="ad-placeholder" style="margin:2rem 0">Google AdSense — In-Content Ad #2</div>
<section id="hazard"><h2>5. 风险提示</h2><div class="danger-box"><div class="box-label">⚠ 关键抉择</div><p style="margin:0;font-size:.85rem;color:var(--text-dim)">「人性证明」来自傀儡国王魂晶，是物品而非武器，是真结局的必要前置条件。想同时获得真结局和该Boss武器，需要两个周目。</p></div></section>
